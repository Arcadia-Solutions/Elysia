# Throwaway stack for test.sh: Chevereto with its MariaDB, and a Postgres
# holding both the Elysia database and a fake backend database. Ports are
# unusual so they do not collide with a dev setup.
services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: elysia
      POSTGRES_PASSWORD: password
      POSTGRES_DB: elysia
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elysia"]
      interval: 2s
      retries: 30

  chevereto_database:
    image: mariadb:jammy
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_USER: chevereto
      MYSQL_PASSWORD: password
      MYSQL_DATABASE: chevereto
    ports:
      - "53306:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--su-mysql", "--connect"]
      interval: 2s
      retries: 30

  chevereto:
    image: chevereto/chevereto:4.4.0
    depends_on:
      chevereto_database:
        condition: service_healthy
    ports:
      - "58083:80"
    environment:
      CHEVERETO_DB_HOST: chevereto_database
      CHEVERETO_DB_PORT: 3306
      CHEVERETO_DB_USER: chevereto
      CHEVERETO_DB_PASS: password
      CHEVERETO_DB_NAME: chevereto
      # Must match the host port: the links Chevereto returns are built from it.
      CHEVERETO_HOSTNAME: localhost:58083
      CHEVERETO_HOSTNAME_PATH: /
      CHEVERETO_HTTPS: 0
