[package]
name = "elysia"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = "4"
actix-multipart = "0.7"
actix-cors = "0.7"
actix-files = "0.6"
sqlx = { version = "0.9", features = ["runtime-tokio", "postgres"] }
utoipa = { version = "5.5", features = ["actix_extras"] }
utoipa-swagger-ui = { version = "9", features = ["actix-web"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
thiserror = "2"
nanoid = "0.4"
infer = "0.16"
imagesize = "0.13"
config = "0.14"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
tempfile = "3"
sha2 = "0.10"
