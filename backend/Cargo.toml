[package]
name = "elysia"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = "4"
actix-multipart = "0.7"
actix-cors = "0.7"
actix-files = "0.6"
sqlx = { version = "0.9", features = ["runtime-tokio", "postgres", "uuid"] }
utoipa = { version = "5.5", features = ["actix_extras"] }
utoipa-swagger-ui = { version = "9", features = ["actix-web"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
thiserror = "2"
nanoid = "0.4"
infer = "0.16"
imagesize = "0.13"
config = "0.14"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
tempfile = "3"
sha2 = "0.10"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
img-parts = "0.3"
webp = "0.3"
ravif = "0.11"
rgb = "0.8"
jpegxl-rs = { version = "0.11", features = ["vendored"] }
argon2 = "0.5"
base64 = "0.22"
url = "2"
rand_core = { version = "0.6", features = ["getrandom"] }
jsonwebtoken = { version = "10", features = ["rust_crypto"] }
uuid = { version = "1", features = ["v4", "serde"] }
tracing = "0.1"
tracing-actix-web = "0.7"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-opentelemetry = "0.33"
opentelemetry = "0.32"
opentelemetry_sdk = { version = "0.32", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.32", features = ["grpc-tonic", "trace", "logs", "metrics"] }
opentelemetry-appender-tracing = "0.32"
