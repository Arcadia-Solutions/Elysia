services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: elysia
      POSTGRES_PASSWORD: password
      POSTGRES_DB: elysia
    ports:
      - "5432:5432"
    volumes:
      - elysia_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elysia"]
      interval: 5s
      timeout: 5s
      retries: 5

  otel-lgtm:
    profiles: [telemetry]
    image: grafana/otel-lgtm:0.17.1
    ports:
      - "3001:3000"
      - "4317:4317"
    volumes:
      - elysia_lgtm_data:/data
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-elysia}
      GF_AUTH_ANONYMOUS_ENABLED: false

  # Host CPU, memory, disk and network metrics, sent to otel-lgtm.
  hostmetrics:
    profiles: [telemetry]
    image: otel/opentelemetry-collector-contrib:0.110.0
    restart: always
    pid: host
    privileged: true
    volumes:
      - /:/hostfs:ro
      - ./opentelemetry/hostmetrics.yaml:/etc/otelcol-contrib/config.yaml:ro
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    depends_on:
      - otel-lgtm

volumes:
  elysia_pgdata:
  elysia_lgtm_data:
