services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: elysia
      POSTGRES_PASSWORD: password
      POSTGRES_DB: elysia
    ports:
      - "5432:5432"
    volumes:
      - elysia_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elysia"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Elysia in docker, reading ./config.yml with the database host overridden.
  elysia:
    profiles: [app]
    build: backend
    restart: always
    environment:
      ELYSIA_DATABASE__HOST: db
    volumes:
      - ./config.yml:/app/config.yml:ro
      - elysia_uploads:/app/data/uploads
    depends_on:
      db:
        condition: service_healthy

  # Web UI on http://localhost:5174, also proxies the API and the images to elysia.
  frontend:
    profiles: [app]
    build: frontend
    restart: always
    ports:
      - "5174:80"
    depends_on:
      - elysia

  otel-lgtm:
    profiles: [telemetry]
    image: grafana/otel-lgtm:0.17.1
    ports:
      - "3001:3000"
      - "4317:4317"
    volumes:
      - elysia_lgtm_data:/data
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-elysia}
      GF_AUTH_ANONYMOUS_ENABLED: false

  # Host CPU, memory, disk and network metrics, sent to otel-lgtm.
  hostmetrics:
    profiles: [telemetry]
    image: otel/opentelemetry-collector-contrib:0.110.0
    restart: always
    pid: host
    privileged: true
    volumes:
      - /:/hostfs:ro
      - ./opentelemetry/hostmetrics.yaml:/etc/otelcol-contrib/config.yaml:ro
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    depends_on:
      - otel-lgtm

volumes:
  elysia_pgdata:
  elysia_uploads:
  elysia_lgtm_data:
