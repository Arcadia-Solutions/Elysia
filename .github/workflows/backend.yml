name: Backend CI

on:
  workflow_dispatch:
  push:
    paths:
      - "backend/**"
      - "!**.md"
      - ".github/workflows/backend.yml"
  pull_request:
    branches:
      - main
    paths:
      - "backend/**"
      - "!**.md"
      - ".github/workflows/backend.yml"

env:
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: "true"

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    # contents: push the coverage badge to the `badges` branch, pull-requests: comment coverage on PRs
    permissions:
      contents: write
      pull-requests: write

    # DATABASE_URL is only used at test runtime: `#[sqlx::test]` connects here
    # and creates a throwaway database per test. Query macros still compile
    # offline from the checked-in .sqlx cache.
    env:
      DATABASE_URL: postgres://elysia:password@localhost:5432/elysia

    services:
      db:
        image: postgres:18
        env:
          POSTGRES_USER: elysia
          POSTGRES_PASSWORD: password
          POSTGRES_DB: elysia
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4

      # rav1e (via ravif) assembles x86 SIMD with nasm at build time, dav1d-sys links libdav1d to decode AVIF.
      - name: Install nasm and libdav1d
        run: sudo apt-get update && sudo apt-get install -y nasm libdav1d-dev

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy, llvm-tools-preview
          cache-workspaces: ./backend

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      # show-env instruments every build, so the server the Chevereto end to end test runs counts toward coverage too.
      - name: Run tests and the Chevereto import end to end test with coverage
        run: |
          source <(cargo llvm-cov show-env --sh)
          cargo llvm-cov clean --workspace
          cargo test
          tests/chevereto/test.sh
          cargo llvm-cov report --json --summary-only --output-path "$RUNNER_TEMP/coverage.json"

      # main's coverage lives in coverage.json on the `badges` branch, which the README badge reads through shields.io.
      - name: Coverage report
        run: |
          pct=$(jq '.data[0].totals.lines.percent * 100 | round / 100' "$RUNNER_TEMP/coverage.json")
          main=$(curl -sf "https://raw.githubusercontent.com/${{ github.repository }}/badges/coverage.json" | jq -r '.message' | tr -d '%' || true)
          {
            echo "### Backend coverage"
            if [ -n "$main" ]; then
              delta=$(jq -rn "($pct - $main) * 100 | round / 100 | if . >= 0 then \"+\(.)\" else tostring end")
              echo "$pct% (main: $main%, $delta%)"
            else
              echo "$pct%"
            fi
          } > "$RUNNER_TEMP/coverage.md"
          cat "$RUNNER_TEMP/coverage.md" >> "$GITHUB_STEP_SUMMARY"
          jq -n --argjson p "$pct" '{schemaVersion: 1, label: "coverage", message: "\($p)%", color: (if $p >= 80 then "brightgreen" elif $p >= 60 then "yellow" else "red" end)}' > "$RUNNER_TEMP/badge.json"

      - name: Comment coverage on PR
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: coverage
          path: ${{ runner.temp }}/coverage.md

      - name: Publish coverage badge
        if: github.ref == 'refs/heads/main'
        working-directory: ${{ runner.temp }}
        run: |
          git init -q -b badges badges
          cp badge.json badges/coverage.json
          cd badges
          git add coverage.json
          git -c user.name=github-actions -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit -qm "coverage badge"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" badges

  formatting:
    name: cargo fmt
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt
          cache-workspaces: ./backend
      - name: Rustfmt Check
        run: cargo fmt --all -- --check
