name: Backend CI

on:
  workflow_dispatch:
  push:
    paths:
      - "backend/**"
      - "!**.md"
      - ".github/workflows/backend.yml"
  pull_request:
    branches:
      - main
    paths:
      - "backend/**"
      - "!**.md"
      - ".github/workflows/backend.yml"

env:
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: "true"

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    # DATABASE_URL is only used at test runtime: `#[sqlx::test]` connects here
    # and creates a throwaway database per test. Query macros still compile
    # offline from the checked-in .sqlx cache.
    env:
      DATABASE_URL: postgres://elysia:password@localhost:5432/elysia

    services:
      db:
        image: postgres:18
        env:
          POSTGRES_USER: elysia
          POSTGRES_PASSWORD: password
          POSTGRES_DB: elysia
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4

      # rav1e (via ravif) assembles x86 SIMD with nasm at build time.
      - name: Install nasm
        run: sudo apt-get update && sudo apt-get install -y nasm

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy
          cache-workspaces: ./backend

      - name: Clippy
        run: cargo clippy

      - name: Build
        run: cargo build

      - name: Run tests
        run: cargo test

  formatting:
    name: cargo fmt
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt
          cache-workspaces: ./backend
      - name: Rustfmt Check
        run: cargo fmt --all -- --check
