name: Docker images

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@v7

      # the default docker driver cannot export a registry cache
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.service }}
          tags: |
            type=semver,pattern={{version}}
            type=ref,event=branch
          # pre-releases don't move `latest`
          flavor: latest=${{ github.event_name == 'release' && !github.event.release.prerelease }}

      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.service }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # in the registry rather than the gha cache, which is scoped to the git ref and so never shared between release tags
          cache-from: type=registry,ref=ghcr.io/arcadia-solutions/elysia-${{ matrix.service }}:buildcache
          cache-to: type=registry,ref=ghcr.io/arcadia-solutions/elysia-${{ matrix.service }}:buildcache,mode=max
